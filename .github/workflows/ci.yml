name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-build-and-appimage:
    name: Linux x86_64 (Build, Test, AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux, Slint, and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            file \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            librsvg2-bin \
            desktop-file-utils \
            xvfb \
            xauth \
            libgl1-mesa-dri

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/voltix.desktop

      - name: Package Linux AppImage
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/licenses/voltix

          rsvg-convert -w 256 -h 256 assets/icons/voltix.svg \
            -o AppDir/usr/share/icons/hicolor/256x256/apps/voltix.png
          cp assets/icons/voltix.svg \
            AppDir/usr/share/icons/hicolor/scalable/apps/voltix.svg
          cp LICENSE AppDir/usr/share/licenses/voltix/LICENSE

          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          ARCH=x86_64 \
          APPIMAGE_EXTRACT_AND_RUN=1 \
            OUTPUT="Voltix-0.1.0-alpha.1-x86_64.AppImage" \
            ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable target/release/voltix \
            --desktop-file packaging/linux/voltix.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/voltix.png \
            --output appimage

          chmod +x Voltix-0.1.0-alpha.1-x86_64.AppImage
          ls -lh Voltix-0.1.0-alpha.1-x86_64.AppImage
          file Voltix-0.1.0-alpha.1-x86_64.AppImage

      - name: Verify AppImage launch in virtual display
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 5s xvfb-run -a ./Voltix-0.1.0-alpha.1-x86_64.AppImage
          code=$?
          set -e
          echo "Xvfb launch exit code: $code"
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "AppImage failed to stay running in virtual display"
            exit "$code"
          fi

      - name: Upload Voltix Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: voltix-linux-x86_64
          path: target/release/voltix
          if-no-files-found: error
          retention-days: 14

      - name: Upload Voltix Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: voltix-linux-x86_64-appimage
          path: Voltix-0.1.0-alpha.1-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  android-arm64-apk:
    name: Android ARM64-v8a (API 26+ Debug APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake unzip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35 and NDK r27
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust toolchain with aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Cargo dependencies for Android
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Run Clippy lints for Android target
        run: cargo ndk -t arm64-v8a -p 26 clippy --lib -- -D warnings

      - name: Build native Android library (arm64-v8a)
        run: |
          cargo ndk -t arm64-v8a -p 26 -o android/app/src/main/jniLibs build --lib --release
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libvoltix.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build Android debug APK
        run: |
          gradle -p android assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk Voltix-0.1.0-alpha.1-arm64.apk
          ls -lh Voltix-0.1.0-alpha.1-arm64.apk
          unzip -l Voltix-0.1.0-alpha.1-arm64.apk | grep "lib/arm64-v8a/libvoltix.so"

      - name: Upload Voltix Android APK
        uses: actions/upload-artifact@v4
        with:
          name: voltix-android-arm64-apk
          path: Voltix-0.1.0-alpha.1-arm64.apk
          if-no-files-found: error
          retention-days: 14
