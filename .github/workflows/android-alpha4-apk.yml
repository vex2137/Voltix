name: Alpha 4 Android APK download
run-name: Alpha 4 Android R2.1 density hotfix

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build and verify installable ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: voltix-alpha4-debug-signing
      cancel-in-progress: false
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      CARGO_TERM_COLOR: always
      APK_NAME: Voltix-0.1.0-alpha.4-r2.1-arm64-debug.apk

    steps:
      - name: Check out the exact Alpha 4 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake unzip libfontconfig1-dev libfreetype6-dev python3-pil

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          ndk_root="$sdk_root/ndk/27.2.12479018"
          test -f "$sdk_root/platforms/android-35/android.jar"
          test -f "$sdk_root/build-tools/35.0.0/lib/d8.jar"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$ndk_root"
            echo "ANDROID_NDK_ROOT=$ndk_root"
            echo "ANDROID_NDK=$ndk_root"
            echo "ANDROID_JAR=$sdk_root/platforms/android-35/android.jar"
            echo "ANDROID_D8_JAR=$sdk_root/build-tools/35.0.0/lib/d8.jar"
          } >> "$GITHUB_ENV"

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: alpha4-pinned-android-arm64

      - name: Test the production mobile root and render acceptance screenshots
        env:
          VOLTIX_UI_SNAPSHOTS: artifacts/mobile-root-snapshots
        run: |
          cargo test --locked --test android_navigation --test android_diagnostics -- --nocapture
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in Path('artifacts/mobile-root-snapshots').glob('*.ppm'):
              Image.open(path).save(path.with_suffix('.png'))
              path.unlink()
          PY

      - name: Build ARM64 native library
        run: |
          cargo ndk -t arm64-v8a --platform 26 -o android/app/src/main/jniLibs build --locked --lib --release
          test -s android/app/src/main/jniLibs/arm64-v8a/libvoltix.so

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable test signing key
        id: test-signing-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: voltix-alpha4-debug-signing-v1

      - name: Require existing test signing key for an in-place update
        env:
          KEY_CACHE_HIT: ${{ steps.test-signing-key.outputs.cache-hit }}
        run: |
          if [ "$KEY_CACHE_HIT" != true ] || [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo '::error::The existing R2 signing key was not restored. Refusing to create a different key that would prevent an in-place update.'
            exit 1
          fi

      - name: Build debug-signed installable APK
        run: |
          gradle -p android assembleDebug -PvoltixPreview=true --no-daemon --max-workers=2
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/$APK_NAME"
          test -s "artifacts/$APK_NAME"

      - name: Verify signature, package metadata and native architecture
        shell: bash
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "artifacts/$APK_NAME" | tee artifacts/APK-SIGNATURE.txt
          "$tools/aapt" dump badging "artifacts/$APK_NAME" > artifacts/APK-METADATA.txt
          python3 - <<'PY'
          import os, pathlib, struct, zipfile
          apk = pathlib.Path('artifacts') / os.environ['APK_NAME']
          metadata = pathlib.Path('artifacts/APK-METADATA.txt').read_text()
          expected = [
              "package: name='com.voltix.monitor.alpha4test' versionCode='7' versionName='0.1.0-alpha.4'",
              "sdkVersion:'26'", "targetSdkVersion:'35'", "native-code: 'arm64-v8a'",
              'application-debuggable',
          ]
          for value in expected:
              assert value in metadata, f'Missing expected APK metadata: {value}'
          with zipfile.ZipFile(apk) as archive:
              libraries = [n for n in archive.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert libraries == ['lib/arm64-v8a/libvoltix.so'], libraries
              assert 'classes.dex' in archive.namelist()
              with archive.open(libraries[0]) as native:
                  header = native.read(64)
              assert header[:4] == b'\x7fELF' and header[4:6] == b'\x02\x01'
              assert struct.unpack_from('<H', header, 18)[0] == 183, 'Expected AArch64 ELF'
              native_bytes = archive.read(libraries[0])
              marker = ('Mobile UI R2.1 / ' + os.environ['SOURCE_COMMIT']).encode()
              assert marker in native_bytes, 'APK does not contain the requested UI/source build identifier'
              for icon in ['dashboard', 'cpu', 'gpu', 'battery', 'more']:
                  resource = pathlib.Path('assets/icons/mobile') / (icon + '.svg')
                  assert resource.read_bytes() in native_bytes, f'APK is missing embedded {icon} SVG'
          pathlib.Path('artifacts/UI-VERIFICATION.txt').write_text(
              'Actual APK native library contains Mobile UI R2.1/source identity and all five bundled navigation SVG resources.\n'
              'This binary-content check does not establish on-device visual correctness.\n'
              'Headless PNGs use simulated presentation fixtures and a Linux software renderer, not Android-device screenshots.\n')
          print('Verified package, version, SDK levels, debug variant, and ARM64 native library')
          PY

      - name: Record and verify APK SHA-256 and source provenance
        working-directory: artifacts
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha256sum "$APK_NAME" > SHA256SUMS
          sha256sum -c SHA256SUMS
          {
            echo "Source commit: $SOURCE_COMMIT"
            echo "Workflow commit: $WORKFLOW_COMMIT"
            echo "Run: $RUN_URL"
            echo 'Rust profile: release; APK variant: isolated debug preview; package: com.voltix.monitor.alpha4test; signing: cached Android debug key'
            echo 'Minimum Android API: 26; target API: 35; ABI: arm64-v8a'
            echo 'Android device appearance and Mali telemetry access are not verified by this workflow.'
            rustc --version
          } > BUILD-INFO.txt
          cat SHA256SUMS

      - name: Upload APK, SHA-256 and verification reports
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: Voltix-Alpha4-R2.1-Density-Hotfix-ARM64-APK
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Add phone download instructions and checksum to run summary
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '## Voltix Alpha 4 — Android Mobile UI R2'
            echo "[Download APK and verification files (ZIP)]($ARTIFACT_URL)"
            echo ''
            echo "Source commit: \`$SOURCE_COMMIT\`"
            echo ''
            echo '```text'
            cat artifacts/SHA256SUMS
            echo '```'
            echo ''
            echo 'On Android: sign in to GitHub in Chrome, download the artifact ZIP, extract it in Files, then tap the APK. If the download control is hidden, enable Desktop site in Chrome.'
            echo 'Confirm the header says R2.1 and About shows the source commit above. Test signing keys are cached for future updates; the old CI #38 key cannot be recovered from its APK.'
            echo 'Allow installation from that browser/file manager when Android asks. This preview installs alongside Voltix as Voltix Alpha4 R2 (com.voltix.monitor.alpha4test). Do not uninstall the original app; its settings/data remain there. Preview settings are separate.'
            echo 'Included PNGs use simulated presentation fixtures and a Linux software renderer; Android-device visual testing remains unverified.'
            echo 'The SHA-256 above verifies the APK inside the ZIP. GitHub also supplies a separate digest for the uploaded artifact archive.'
            echo 'Artifacts expire after 30 days; rerun this manual workflow to create a fresh download.'
          } >> "$GITHUB_STEP_SUMMARY"
