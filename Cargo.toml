[package]
name = "voltix"
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Native hardware monitoring, diagnostics, and telemetry application"
repository = "https://github.com/vex2137/Voltix"
readme = "README.md"

[dependencies]
slint = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.10"

[build-dependencies]
slint-build = "1.9"
